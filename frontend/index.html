<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Manager — DevOps Project 04</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: #1e293b;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    h1 { font-size: 28px; margin-bottom: 8px; color: #38bdf8; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
    .badge {
      display: inline-block;
      background: #0ea5e9;
      color: white;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"]:focus { border-color: #38bdf8; }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-add {
      background: #0ea5e9;
      color: white;
    }
    .btn-add:hover { background: #38bdf8; transform: translateY(-1px); }
    .task-list { list-style: none; }
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #0f172a;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #1e293b;
      transition: all 0.2s;
    }
    .task-item:hover { border-color: #334155; }
    .task-title {
      flex: 1;
      font-size: 15px;
    }
    .task-title.done {
      text-decoration: line-through;
      color: #475569;
    }
    .btn-done {
      background: #10b981;
      color: white;
      padding: 6px 12px;
      font-size: 12px;
    }
    .btn-done:hover { background: #34d399; }
    .btn-delete {
      background: #ef4444;
      color: white;
      padding: 6px 12px;
      font-size: 12px;
    }
    .btn-delete:hover { background: #f87171; }
    .empty-state {
      text-align: center;
      color: #475569;
      padding: 40px 0;
      font-size: 15px;
    }
    .status-bar {
      margin-top: 20px;
      padding: 10px 14px;
      background: #0f172a;
      border-radius: 8px;
      font-size: 12px;
      color: #64748b;
    }
    .status-bar span { color: #38bdf8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Task Manager <span class="badge">EKS</span></h1>
    <p class="subtitle">DevOps Project 04 — Multi-Tier App on AWS EKS</p>

    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button class="btn-add" onclick="addTask()">+ Add Task</button>
    </div>

    <ul class="task-list" id="taskList">
      <li class="empty-state">Loading tasks...</li>
    </ul>

    <div class="status-bar">
      API: <span id="apiStatus">Connecting...</span> &nbsp;|&nbsp;
      Tasks: <span id="taskCount">0</span>
    </div>
  </div>

  <script>
    // WHY window.BACKEND_URL? Nginx will inject this at runtime so the same
    // Docker image works in any environment — local, staging, or production.
    const API = window.BACKEND_URL || '/api';

    async function loadTasks() {
      try {
        const res = await fetch(`${API}/tasks`);
        const tasks = await res.json();
        document.getElementById('apiStatus').textContent = '✅ Connected';
        document.getElementById('taskCount').textContent = tasks.length;
        const list = document.getElementById('taskList');
        if (tasks.length === 0) {
          list.innerHTML = '<li class="empty-state">No tasks yet. Add one above! 🎉</li>';
          return;
        }
        list.innerHTML = tasks.map(t => `
          <li class="task-item">
            <span class="task-title ${t.completed ? 'done' : ''}">${t.title}</span>
            <button class="btn-done" onclick="toggleTask(${t.id})">
              ${t.completed ? '↩ Undo' : '✓ Done'}
            </button>
            <button class="btn-delete" onclick="deleteTask(${t.id})">🗑</button>
          </li>
        `).join('');
      } catch (e) {
        document.getElementById('apiStatus').textContent = '❌ Offline';
        document.getElementById('taskList').innerHTML =
          '<li class="empty-state">Cannot reach backend. Check your deployment.</li>';
      }
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const title = input.value.trim();
      if (!title) return;
      await fetch(`${API}/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      input.value = '';
      loadTasks();
    }

    async function toggleTask(id) {
      await fetch(`${API}/tasks/${id}`, { method: 'PUT' });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API}/tasks/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    document.getElementById('taskInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTask();
    });

    loadTasks();
    setInterval(loadTasks, 10000); // auto-refresh every 10 seconds
  </script>
</body>
</html>
